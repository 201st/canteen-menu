<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>食堂菜谱 · 手机检索</title>
    <style>
        /* ... (样式部分保持不变，与您之前提供的完全一致) ... */
    </style>
</head>
<body>
<div class="container">
    <h1>🍚 食堂菜谱 <small>扫码即用</small></h1>
    <div class="search-panel">
        <span style="color:#f97316;">🔍</span>
        <input class="search-box" id="searchInput" placeholder="例如 土豆 牛肉 鸡蛋" autofocus>
        <button class="clear-btn" id="clearBtn">✖</button>
        <span class="stats" id="resultCount">加载中…</span>
    </div>
    <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>品名</th><th>档口</th><th>补贴价</th><th>熟重</th><th>单位</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="5" class="loading">⏳ 正在读取菜单数据…</td></tr></tbody>
        </table>
    </div>
    <div class="footer-note">
        ⭐ 数据来自本地文件，管理员修改 menu.csv 并上传后页面自动更新。
    </div>
</div>

<script>
(function() {
    // =======================================================
    // 修改点：数据源改为同目录下的 menu.csv 文件
    // =======================================================
    const CSV_FILE_URL = 'menu.csv';  // 指向您刚上传的文件

    const tbody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultSpan = document.getElementById('resultCount');

    let dishes = [];

    function loadMenu() {
        fetch(CSV_FILE_URL)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`无法加载文件 (HTTP ${response.status})`);
                }
                return response.text();
            })
            .then(csvText => {
                // 简单解析 CSV（按行分割，按逗号分割，并去除可能的引号）
                const lines = csvText.trim().split(/\r?\n/);
                if (lines.length < 2) {
                    dishes = [];
                } else {
                    // 跳过第一行表头
                    dishes = lines.slice(1).map(line => {
                        // 处理简单 CSV：按逗号分割，并移除单元格首尾可能存在的引号
                        const cells = line.split(',').map(cell => cell.trim().replace(/^"(.*)"$/, '$1'));
                        // 确保至少有5列
                        return [
                            cells[0] || '',
                            cells[1] || '',
                            parseFloat(cells[2]) || 0,
                            cells[3] || '—',
                            cells[4] || ''
                        ];
                    }).filter(item => item[0] !== '');
                }
                renderDishes('');
            })
            .catch(err => {
                console.error('加载失败:', err);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">❌ 加载失败，请检查文件 menu.csv 是否存在</td></tr>`;
            });
    }

    function renderDishes(filterText) {
        const term = filterText.trim().toLowerCase();
        const filtered = term === '' ? dishes : dishes.filter(d => d[0].toLowerCase().includes(term));
        resultSpan.innerHTML = `共 <strong>${filtered.length}</strong> 项`;

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="5">🥲 没有 “${filterText}” 相关菜品</td></tr>`;
            return;
        }

        let html = '';
        filtered.forEach(d => {
            const [name, stall, price, weight, unit] = d;
            html += `<tr>
                <td><strong>${name}</strong></td>
                <td><span class="stall-badge">${stall}</span></td>
                <td><span class="price">¥${price.toFixed(2)}</span></td>
                <td class="weight">${weight}</td>
                <td><span class="unit">${unit}</span></td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    loadMenu();

    searchInput.addEventListener('input', (e) => renderDishes(e.target.value));
    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        renderDishes('');
        searchInput.focus();
    });
})();
</script>
</body>
</html>
